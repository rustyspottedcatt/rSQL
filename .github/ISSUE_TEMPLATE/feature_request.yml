name: Feature request
description: Suggest one specific improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that rSQL doesn't handle?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches you considered
