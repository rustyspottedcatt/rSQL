name: Bug report
description: Something in rSQL is broken and you can reproduce it.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest script or list of steps that shows the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Tool versions
      description: Whichever you use of Lune, Rojo, Wally, Selene, StyLua and Roblox Studio, plus your rSQL version.
